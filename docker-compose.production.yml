services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  api:
    build:
      context: .
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL: redis://redis:6379/0
    secrets: [database_url]
    ports:
      - "127.0.0.1:8000:8000"
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

  nginx:
    image: nginx:alpine
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [internal, edge]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256m

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  database_url:
    file: ./secrets/database_url

networks:
  internal:
    internal: true
  edge:
