services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: slaif
      POSTGRES_DB: slaif_gateway
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slaif -d slaif_gateway"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --save '' --appendonly no --protected-mode yes --requirepass \"$$(cat /run/secrets/redis_password)\""]
    secrets:
      - redis_password
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$(cat /run/secrets/redis_password)\" ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  migrations:
    build:
      context: .
      target: runtime
    user: root
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      TOKEN_HMAC_SECRET_V1_FILE: /run/secrets/token_hmac_secret_v1
      ADMIN_SESSION_SECRET_FILE: /run/secrets/admin_session_secret
      ONE_TIME_SECRET_ENCRYPTION_KEY_FILE: /run/secrets/one_time_secret_encryption_key
      OPENAI_UPSTREAM_API_KEY_FILE: /run/secrets/openai_upstream_api_key
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
    secrets:
      - database_url
      - token_hmac_secret_v1
      - admin_session_secret
      - one_time_secret_encryption_key
      - openrouter_api_key
      - openai_upstream_api_key
      - redis_url
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  api:
    build:
      context: .
      target: runtime
    user: root
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      TOKEN_HMAC_SECRET_V1_FILE: /run/secrets/token_hmac_secret_v1
      ADMIN_SESSION_SECRET_FILE: /run/secrets/admin_session_secret
      ONE_TIME_SECRET_ENCRYPTION_KEY_FILE: /run/secrets/one_time_secret_encryption_key
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
      OPENAI_UPSTREAM_API_KEY_FILE: /run/secrets/openai_upstream_api_key
      ENABLE_REDIS_RATE_LIMITS: "true"
      RATE_LIMIT_FAIL_CLOSED: "true"
      DEFAULT_RATE_LIMIT_REQUESTS_PER_MINUTE: "120"
      DEFAULT_RATE_LIMIT_TOKENS_PER_MINUTE: "100000"
      DEFAULT_RATE_LIMIT_CONCURRENT_REQUESTS: "4"
      RATE_LIMIT_CONCURRENCY_TTL_SECONDS: "300"
      RATE_LIMIT_CONCURRENCY_HEARTBEAT_SECONDS: "30"
      RATE_LIMIT_CONCURRENCY_TTL_GRACE_SECONDS: "30"
    secrets:
      - database_url
      - token_hmac_secret_v1
      - admin_session_secret
      - one_time_secret_encryption_key
      - openrouter_api_key
      - openai_upstream_api_key
      - redis_url
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/healthz\", timeout=3)'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "127.0.0.1:${SLAIF_API_DIAGNOSTIC_PORT:-8000}:8000"
    networks: [internal, egress]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

  nginx:
    image: nginx:alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${SLAIF_NGINX_HTTP_PORT:-80}:80"
      - "${SLAIF_NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SLAIF_TLS_DIR:-./secrets/tls}:/etc/nginx/certs:ro
    networks: [internal, edge]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256m

  worker:
    profiles: [async]
    build:
      context: .
      target: runtime
    user: root
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      TOKEN_HMAC_SECRET_V1_FILE: /run/secrets/token_hmac_secret_v1
      ADMIN_SESSION_SECRET_FILE: /run/secrets/admin_session_secret
      ONE_TIME_SECRET_ENCRYPTION_KEY_FILE: /run/secrets/one_time_secret_encryption_key
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
      OPENAI_UPSTREAM_API_KEY_FILE: /run/secrets/openai_upstream_api_key
      ENABLE_REDIS_RATE_LIMITS: "true"
      RATE_LIMIT_FAIL_CLOSED: "true"
      DEFAULT_RATE_LIMIT_REQUESTS_PER_MINUTE: "120"
      DEFAULT_RATE_LIMIT_TOKENS_PER_MINUTE: "100000"
      DEFAULT_RATE_LIMIT_CONCURRENT_REQUESTS: "4"
      RATE_LIMIT_CONCURRENCY_TTL_SECONDS: "300"
      RATE_LIMIT_CONCURRENCY_HEARTBEAT_SECONDS: "30"
      RATE_LIMIT_CONCURRENCY_TTL_GRACE_SECONDS: "30"
    secrets:
      - database_url
      - token_hmac_secret_v1
      - admin_session_secret
      - one_time_secret_encryption_key
      - openrouter_api_key
      - openai_upstream_api_key
      - redis_url
    command: ["celery", "-A", "slaif_gateway.workers.celery_app:celery_app", "worker", "--loglevel=INFO"]
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  scheduler:
    profiles: [async]
    build:
      context: .
      target: runtime
    user: root
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      TOKEN_HMAC_SECRET_V1_FILE: /run/secrets/token_hmac_secret_v1
      ADMIN_SESSION_SECRET_FILE: /run/secrets/admin_session_secret
      ONE_TIME_SECRET_ENCRYPTION_KEY_FILE: /run/secrets/one_time_secret_encryption_key
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
      OPENAI_UPSTREAM_API_KEY_FILE: /run/secrets/openai_upstream_api_key
    secrets:
      - database_url
      - token_hmac_secret_v1
      - admin_session_secret
      - one_time_secret_encryption_key
      - openrouter_api_key
      - openai_upstream_api_key
      - redis_url
    command: ["celery", "-A", "slaif_gateway.workers.celery_app:celery_app", "beat", "--loglevel=INFO"]
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

secrets:
  postgres_password:
    file: ${SLAIF_POSTGRES_PASSWORD_FILE:-./secrets/postgres_password}
  database_url:
    file: ${SLAIF_DATABASE_URL_FILE:-./secrets/database_url}
  token_hmac_secret_v1:
    file: ${SLAIF_TOKEN_HMAC_SECRET_V1_FILE:-./secrets/token_hmac_secret_v1}
  admin_session_secret:
    file: ${SLAIF_ADMIN_SESSION_SECRET_FILE:-./secrets/admin_session_secret}
  one_time_secret_encryption_key:
    file: ${SLAIF_ONE_TIME_SECRET_ENCRYPTION_KEY_FILE:-./secrets/one_time_secret_encryption_key}
  openrouter_api_key:
    file: ${SLAIF_OPENROUTER_API_KEY_FILE:-./secrets/openrouter_api_key}
  openai_upstream_api_key:
    file: ${SLAIF_OPENAI_UPSTREAM_API_KEY_FILE:-./secrets/openai_upstream_api_key}
  redis_password:
    file: ${SLAIF_REDIS_PASSWORD_FILE:-./secrets/redis_password}
  redis_url:
    file: ${SLAIF_REDIS_URL_FILE:-./secrets/redis_url}

networks:
  internal:
    internal: true
  edge:
  egress:

volumes:
  postgres_data:
