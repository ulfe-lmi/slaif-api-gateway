services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  migrations:
    build:
      context: .
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      TOKEN_HMAC_SECRET_V1_FILE: /run/secrets/token_hmac_secret_v1
      ADMIN_SESSION_SECRET_FILE: /run/secrets/admin_session_secret
      ONE_TIME_SECRET_ENCRYPTION_KEY_FILE: /run/secrets/one_time_secret_encryption_key
    secrets:
      - database_url
      - token_hmac_secret_v1
      - admin_session_secret
      - one_time_secret_encryption_key
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  api:
    build:
      context: .
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL: redis://redis:6379/0
      TOKEN_HMAC_SECRET_V1_FILE: /run/secrets/token_hmac_secret_v1
      ADMIN_SESSION_SECRET_FILE: /run/secrets/admin_session_secret
      ONE_TIME_SECRET_ENCRYPTION_KEY_FILE: /run/secrets/one_time_secret_encryption_key
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
      OPENAI_UPSTREAM_API_KEY_FILE: /run/secrets/openai_upstream_api_key
    secrets:
      - database_url
      - token_hmac_secret_v1
      - admin_session_secret
      - one_time_secret_encryption_key
      - openrouter_api_key
      - openai_upstream_api_key
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/healthz\", timeout=3)'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "127.0.0.1:8000:8000"
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

  nginx:
    image: nginx:alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets/tls:/etc/nginx/certs:ro
    networks: [internal, edge]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256m

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  database_url:
    file: ./secrets/database_url
  token_hmac_secret_v1:
    file: ./secrets/token_hmac_secret_v1
  admin_session_secret:
    file: ./secrets/admin_session_secret
  one_time_secret_encryption_key:
    file: ./secrets/one_time_secret_encryption_key
  openrouter_api_key:
    file: ./secrets/openrouter_api_key
  openai_upstream_api_key:
    file: ./secrets/openai_upstream_api_key

networks:
  internal:
    internal: true
  edge:
